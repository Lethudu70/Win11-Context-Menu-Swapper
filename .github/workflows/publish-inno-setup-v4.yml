name: Build, test and publish V4.0 Inno Setup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'V4/installer/**'
      - 'V4/scripts/build-installer.ps1'
      - 'V4/scripts/test-installer.ps1'
      - '.github/workflows/publish-inno-setup-v4.yml'
permissions:
  contents: write
jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Download and verify published portable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $release = gh api "repos/$env:GH_REPO/releases/tags/V4.0" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read release V4.0' }
          $asset = @($release.assets | Where-Object name -EQ 'ContextMenuSwapper-v4.0-win64-portable.zip')
          if ($asset.Count -ne 1 -or $asset[0].digest -notlike 'sha256:*') { throw 'Missing portable asset or SHA-256 digest' }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/published-portable" -Force | Out-Null
          gh release download V4.0 --pattern 'ContextMenuSwapper-v4.0-win64-portable.zip' --dir "$env:RUNNER_TEMP/published-portable"
          if ($LASTEXITCODE -ne 0) { throw 'Portable download failed' }
          $zip = Join-Path $env:RUNNER_TEMP 'published-portable/ContextMenuSwapper-v4.0-win64-portable.zip'
          $digest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ("sha256:$digest" -ne $asset[0].digest) { throw 'Published portable checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP/published-portable/extracted"
          $apps = @(Get-ChildItem "$env:RUNNER_TEMP/published-portable/extracted" -Recurse -File -Filter ContextMenuSwapper.exe)
          if ($apps.Count -ne 1) { throw 'Expected one portable executable' }
          "PORTABLE_DIR=$($apps[0].DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install current Inno Setup compiler
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -notin @(0,3010)) { throw 'Inno Setup installation failed' }
          exit 0
      - name: Compile branded French/English setup
        shell: pwsh
        run: |
          ./V4/scripts/build-installer.ps1 -PortableDirectory $env:PORTABLE_DIR -OutputDirectory "$env:RUNNER_TEMP/setup-output"
      - name: Test install, shortcuts, runtime and uninstall
        shell: pwsh
        run: |
          ./V4/scripts/test-installer.ps1 -Installer "$env:RUNNER_TEMP/setup-output/ContextMenuSwapper-v4.0-Setup.exe" -PortableDirectory $env:PORTABLE_DIR -ReportDirectory "$env:RUNNER_TEMP/setup-test"
      - uses: actions/upload-artifact@v4
        with:
          name: V4.0-Inno-Setup-and-verification
          path: |
            ${{ runner.temp }}/setup-output/*
            ${{ runner.temp }}/setup-test/installer-verification.json
          if-no-files-found: error
      - name: Add setup to existing V4.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload V4.0 "$env:RUNNER_TEMP/setup-output/ContextMenuSwapper-v4.0-Setup.exe" "$env:RUNNER_TEMP/setup-output/ContextMenuSwapper-v4.0-Setup.sha256"
          if ($LASTEXITCODE -ne 0) { throw 'Setup release upload failed; existing assets were not overwritten' }
